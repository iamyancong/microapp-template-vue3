name: CI Checks

on:
  push:
    branches: [main, template, master]
  pull_request:
    branches: [main, template, master]

jobs:
  quality:
    name: Code Quality & Performance Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Agent Rules & Skills Validation
        run: |
          pnpm check:skills
          pnpm check:agents

      - name: Lint Check
        run: pnpm lint:check

      - name: Type Check
        run: pnpm type-check

      - name: Performance & Bundle Budget Test
        run: pnpm test:performance

      - name: Build Test
        run: pnpm build
